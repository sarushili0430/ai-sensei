# =============================================================================
# ai-sensei — Codemagic
# =============================================================================
# Division of labour:
#   GitHub Actions (.github/workflows/ci.yml)
#     ... lint / typecheck / test / flutter analyze / golden tests / secret scanning
#   Codemagic (this file)
#     ... device builds and distribution (TestFlight / Google Play)
#
# Checks live on the Actions side because Codemagic's mac instances are metered.
# Here we run only what is needed to avoid distributing something broken.
#
# The Codemagic UI settings (API keys, keystore, variable groups) are collected in
# docs/ci/codemagic.md.
# Using this file requires "Switch to YAML configuration" in the Workflow Editor.
# =============================================================================

definitions:
  # apps/mobile/.fvmrc is authoritative for the Flutter version.
  # Codemagic cannot take the SDK version from an env var or a file, so it is written
  # by hand here and assert_flutter_version fails on drift.
  flutter_version: &flutter_version 3.44.8

  scripts:
    # Placed first. It checks the contents of the mobile-dart-defines variable group,
    # because otherwise the first sign that nothing was passed is the final flutter build
    #   API_BASE_URL: unbound variable
    # which fails after burning ten-plus minutes of metered mac time.
    - &assert_dart_defines
      name: dart-define に渡す環境変数が揃っているか
      script: |
        set -euo pipefail
        missing=""
        [ -n "${API_BASE_URL:-}" ] || missing="$missing API_BASE_URL"

        # Only the RevenueCat key for the platform this workflow builds is checked.
        # Before products exist in the stores there is no appl_ / goog_ key yet, so the
        # Test Store key (REVENUECAT_SDK_KEY) also passes - the app falls back to the
        # Test Store key when the per-platform key is empty
        # (apiKeyFor in lib/src/features/monetization/data/revenuecat_config.dart).
        case "${TARGET_PLATFORM:-}" in
          ios)     platform_key_name=REVENUECAT_IOS_PUBLIC_SDK_KEY;     platform_key="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" ;;
          android) platform_key_name=REVENUECAT_ANDROID_PUBLIC_SDK_KEY; platform_key="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" ;;
          *)
            echo "TARGET_PLATFORM が ios / android のどちらでもない: '${TARGET_PLATFORM:-}'"
            echo "codemagic.yaml の environment.vars で設定すること。"
            exit 1
            ;;
        esac
        if [ -z "$platform_key" ] && [ -z "${REVENUECAT_SDK_KEY:-}" ]; then
          missing="$missing ${platform_key_name}(または REVENUECAT_SDK_KEY)"
        fi

        if [ -n "$missing" ]; then
          echo "次の環境変数がビルドマシンに渡っていない:$missing"
          echo
          echo "Codemagic UI > このアプリ > Environment variables を開き、"
          echo "  - グループ名が mobile-dart-defines になっているか"
          echo "    (codemagic.yaml の environment.groups と完全一致が要る)"
          echo "  - 変数がそのグループに入っているか"
          echo "  - グループがこのアプリに紐づいているか"
          echo "を確認すること。"
          echo
          echo "いずれも公開鍵・公開URLなので secure にする必要はない。"
          exit 1
        fi

        if [ -z "$platform_key" ]; then
          echo "警告: ${platform_key_name} が空。Test Store の鍵で配布する。"
          echo "実売のビルドではない(アプリ内にもその旨が出る)。"
        fi
        echo "dart-define 用の環境変数は揃っている"

    - &assert_flutter_version
      name: .fvmrc とSDKのバージョンが一致しているか
      script: |
        set -euo pipefail
        pinned="$(python3 -c "import json;print(json.load(open('apps/mobile/.fvmrc'))['flutter'])")"
        actual="$(flutter --version --machine | python3 -c "import json,sys;print(json.load(sys.stdin)['frameworkVersion'])")"
        if [ "$pinned" != "$actual" ]; then
          echo "apps/mobile/.fvmrc は ${pinned} だが、このビルドは ${actual} で走っている。"
          echo "codemagic.yaml の definitions.flutter_version を ${pinned} に合わせること。"
          exit 1
        fi
        echo "Flutter ${actual} (.fvmrc と一致)"

    - &pub_get
      name: 依存の取得
      script: flutter pub get
      working_directory: apps/mobile

    - &build_runner
      name: コード生成 (freezed / json_serializable / riverpod)
      # Generated files (*.freezed.dart / *.g.dart) are not committed, so build them here
      script: dart run build_runner build --delete-conflicting-outputs
      working_directory: apps/mobile

    - &analyze
      name: flutter analyze
      script: flutter analyze
      working_directory: apps/mobile

    - &test
      name: flutter test (golden以外)
      # Goldens treat Linux rasterization as authoritative (test/golden/README.md), so
      # they always fail on a mac instance. What matters here is contract_fixture_test:
      # we want to stop shipping with the TypeScript-side contract drifted.
      script: flutter test --exclude-tags golden
      working_directory: apps/mobile

workflows:
  # ---------------------------------------------------------------------------
  # iOS -> TestFlight
  #
  # Ships what lands on develop to internal testers. iOS goes first (see the README),
  # so this is the only workflow that runs automatically.
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # The *name* of the App Store Connect API key registered under
      # Codemagic UI > Settings > Integrations > Developer Portal.
      # It happens to match the file name but is unrelated to it, and it is not the name
      # of the certificate under Code signing identities (aisenseidist) - writing that
      # fails with App Store Connect integration "..." does not exist.
      app_store_connect: codemagic

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        # The variable group holding API_BASE_URL / REVENUECAT_IOS_PUBLIC_SDK_KEY /
        # REVENUECAT_ANDROID_PUBLIC_SDK_KEY. All are public keys and URLs needing no
        # secrecy (we only want to swap them per environment).
        - mobile-dart-defines
        # The variable group holding CERTIFICATE_PRIVATE_KEY (the private key embedded in
        # the distribution certificate). This one is a real private key, so register it as
        # Secure. How to create it and why it is needed: "2. iOS signing" in docs/ci/codemagic.md.
        - ios-code-signing
      vars:
        BUNDLE_ID: jp.co.aiSensei
        # The bundle id of OneSignal's Notification Service Extension. Keep it in step
        # with the NSE target's PRODUCT_BUNDLE_IDENTIFIER in ios/Runner.xcodeproj. The
        # signing verification step checks that this id's profile was downloaded too.
        EXTENSION_BUNDLE_ID: jp.co.aiSensei.OneSignalNotificationServiceExtension
        # Used by assert_dart_defines to decide which RevenueCat key to require
        TARGET_PLATFORM: ios

      # environment.ios_signing is deliberately absent.
      #
      # Despite the name it is not automatic signing but "pick, from the signing files
      # already uploaded to the Codemagic UI, one matching distribution_type and
      # bundle_identifier" ("uploaded signing files" in
      # docs.codemagic.io/yaml-code-signing/signing-ios/). That is manual signing, with the
      # UI's files as the source of truth.
      #
      # While it was written, the aisenseiprd uploaded by hand to the Codemagic UI was
      # used. That profile had been created without App Groups, so once the NSE arrived it
      # failed with
      #   Provisioning profile "aisenseiprd" doesn't include the App Groups capability
      # and no amount of fixing the Developer Portal helped (the UI's file is a separate
      # thing, so Portal changes never reach it).
      #
      # Now the scripts below call app-store-connect fetch-signing-files and obtain or
      # generate from Apple. Adding ios_signing back mixes the two schemes and fails with
      # No matching profiles found for bundle identifier ..., so do not add it.

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
      # Do not keep running stale builds on consecutive pushes (it only eats mac time)
      cancel_previous_builds: true

    scripts:
      - *assert_dart_defines
      - *assert_flutter_version
      - *pub_get
      - *build_runner
      - *analyze
      - *test

      # Signing certificates and profiles are obtained or generated from Apple here,
      # using integrations.app_store_connect's API key (what Codemagic calls automatic
      # code signing). Leaving it to the built-in step (environment.ios_signing) is a
      # different thing that uses files uploaded to the UI - see the block above.

      - name: 署名ファイルを Apple から取得し Xcode プロジェクトに適用する
        working_directory: apps/mobile
        script: |
          set -euo pipefail

          # Without the private key, fetch-signing-files creates a new distribution
          # certificate on every build. A team can hold only so many Distribution
          # certificates, so a few builds hit the cap and issuing fails from then on.
          # You notice only after hitting it, so check first.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY が渡っていない。"
            echo "Codemagic UI > このアプリ > Environment variables で、"
            echo "  - グループ名が ios-code-signing になっているか"
            echo "  - そのグループがこのアプリに紐づいているか"
            echo "  - 値が Secure で入っているか"
            echo "を確認すること。作り方は docs/ci/codemagic.md の「2. iOS の署名」。"
            exit 1
          fi

          # Create the build machine's keychain and make it usable for signing
          keychain initialize

          # Fetch certificates and profiles from Apple, creating them if absent.
          # BUNDLE_ID is matched by prefix, so passing jp.co.aiSensei also fetches the
          # extension's (jp.co.aiSensei.OneSignalNotificationServiceExtension) - but only
          # if that Identifier exists in the Developer Portal. Otherwise it silently
          # fetches only the main app's, which the check below rejects.
          # (--strict-match-identifier would limit it to the main app. Do not add it.)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

          # Put the fetched certificates into the keychain
          keychain add-certificates

          # Where profiles are saved varies by cli-tools version (currently under Xcode's
          # directory). Check the same two locations use-profiles checks by default.
          # Checking only one misdiagnoses a successful fetch as "nothing was downloaded".
          profile_dirs=(
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          )
          found=0
          for d in "${profile_dirs[@]}"; do
            if ls "$d"/*.mobileprovision >/dev/null 2>&1; then
              found=1
              echo "取得済みプロファイル ($d):"
              ls -1 "$d"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "プロビジョニングプロファイルが1つもダウンロードされていない。"
            echo "よくある原因:"
            echo "  - Developer Portal に ${BUNDLE_ID} のIdentifierが無い"
            echo "  - App Store Connect APIキー(integrations の 'codemagic')の権限が App Manager 未満"
            exit 1
          fi

          # Inspect the profiles' contents too.
          # Since the Notification Service Extension arrived, "at least one exists" is no
          # longer enough. Letting it through means, minutes later after the whole Xcode
          # archive has run,
          #   Provisioning profile "..." doesn't include the App Groups capability
          #   Signing for "OneSignalNotificationServiceExtension" requires a development team
          # Both are fixed on the Developer Portal side, so fail earlier.
          python3 - "$BUNDLE_ID" "$EXTENSION_BUNDLE_ID" "${profile_dirs[@]}" <<'PY'
          import glob, os, plistlib, subprocess, sys

          app_id, ext_id = sys.argv[1:3]
          profile_dirs = sys.argv[3:]

          # The entitlements file is authoritative for the App Group being requested.
          # (The NSE must carry the same string, so checking the main app's is enough.)
          with open("ios/Runner/Runner.entitlements", "rb") as f:
              wanted = set(plistlib.load(f).get("com.apple.security.application-groups", []))

          # bundle id -> that profile's provenance.
          # Name and App Group alone say nothing when "a profile deleted in the Portal came
          # down again", so the provenance is recorded too.
          profiles = {}
          paths = []
          for d in profile_dirs:
              paths += glob.glob(os.path.join(d, "*.mobileprovision"))
          for path in sorted(paths):
              raw = subprocess.run(["security", "cms", "-D", "-i", path],
                                   capture_output=True).stdout
              if not raw:
                  continue
              parsed = plistlib.loads(raw)
              ent = parsed.get("Entitlements", {})
              # application-identifier has the form "TEAMID.jp.co.aiSensei"
              bundle = ent.get("application-identifier", "").split(".", 1)[-1]
              profiles[bundle] = {
                  "name": parsed.get("Name", "?"),
                  "groups": set(ent.get("com.apple.security.application-groups", [])),
                  "team": ", ".join(parsed.get("TeamIdentifier", [])) or "?",
                  "created": str(parsed.get("CreationDate", "?"))[:19],
                  "uuid": parsed.get("UUID", "?"),
              }

          problems = []
          for target in (app_id, ext_id):
              hit = profiles.get(target)
              if hit is None:
                  # A TEAMID.* wildcard cannot hold App Groups, so it is no substitute
                  problems.append("%s のプロファイルが無い" % target)
                  continue
              missing = wanted - hit["groups"]
              if missing:
                  problems.append('%s のプロファイル "%s" に App Group %s が入っていない'
                                  % (target, hit["name"], ", ".join(sorted(missing))))

          if not problems:
              print("プロファイルは本体・拡張ぶん揃っており、App Group も入っている")
              sys.exit(0)

          for p in problems:
              print("NG: " + p)
          print("")
          print("Developer Portal (developer.apple.com) 側の設定が足りていない。")
          print("docs/ci/store-setup.md の 1-2-1 のとおりに直すこと:")
          print("  1. Identifiers > App Groups に %s を作る" % ", ".join(sorted(wanted)))
          print("  2. App ID %s の Capability で App Groups を有効にし、上のグループを割り当てる" % app_id)
          print("  3. App ID %s を Explicit で作り、同じく App Groups を割り当てる" % ext_id)
          print("  4. Profiles に残っている古いプロファイルを消す。")
          print("     fetch-signing-files は条件に合う既存のものがあればそれを使い、")
          print("     無いときだけ作る(--create)。Capability を足しても")
          print("     既存のプロファイルは古い内容のままなので、消さないと作り直されない。")
          print("")
          print("このビルドが見たプロファイル:")
          for bundle, info in sorted(profiles.items()):
              print("  %s" % bundle)
              print("      名前: %s" % info["name"])
              print("      App Groups: %s"
                    % (", ".join(sorted(info["groups"])) or "(無し)"))
              print("      Team: %s / 作成: %s" % (info["team"], info["created"]))
              print("      UUID: %s" % info["uuid"])
          print("")
          print("Portal で消したはずのプロファイルがまだ降ってくるときは、")
          print("上の Team と作成日で取得元を突き止めること:")
          print("  - 作成日がこのビルドの時刻 → fetch-signing-files が作ったもの。")
          print("    それでも App Groups が空なら、App ID 側の Capability が")
          print("    保存されていない(Edit でグループを選んだあと Save したか)。")
          print("  - 作成日がもっと前 → Portal に古いものが残っている。")
          print("    Profiles 画面のフィルタ(All / Development / Distribution)も疑う。")
          print("  - Team が Portal の画面右上に出ているものと違う")
          print("    → App Store Connect APIキー(integrations の 'codemagic')が")
          print("      別チームのもの。そのチームには App Group も拡張のIdentifierも無いので、")
          print("      何度直しても直らない。APIキーを作り直すこと。")
          sys.exit(1)
          PY

          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --export-options-plist "$HOME/export_options.plist"

          echo "--- $HOME/export_options.plist ---"
          cat "$HOME/export_options.plist"

      - name: IPA をビルド
        working_directory: apps/mobile
        script: |
          set -euo pipefail
          # pubspec.yaml's version is authoritative for the version name (the 1.2.3 part).
          # Only the build number is overridden with Codemagic's counter (TestFlight rejects
          # a re-upload with the same build number).
          # Unset variables must not trip set -u here. What is required is already checked
          # by assert_dart_defines, so passing through is fine.
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="${API_BASE_URL:?変数グループ mobile-dart-defines がこのビルドに渡っていない。Codemagic UI > このアプリ > Environment variables でグループ名と紐づけを確認すること}" \
            --dart-define=REVENUECAT_IOS_PUBLIC_SDK_KEY="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ANDROID_PUBLIC_SDK_KEY="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_SDK_KEY="${REVENUECAT_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ENTITLEMENT_ID="${REVENUECAT_ENTITLEMENT_ID:-premium}" \
            --dart-define=REVENUECAT_OFFERING_ID="${REVENUECAT_OFFERING_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-47044c5e-15eb-49ec-bdd4-e0ed2219a799}" \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-}" \
            --dart-define=TERMS_URL="${TERMS_URL:-}" \
            --dart-define=SUPPORT_EMAIL="${SUPPORT_EMAIL:-}" \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      # Needed to symbolicate crashes (Sentry).
      # Until a destination was configured this was collecting symbols only (plan §10-7).
      # `--dart-define=SENTRY_DSN` is passed now, so the pair completes the moment the
      # variable group has a value. With an empty DSN the monitoring is disabled entirely
      # (`SentryConfig` in `src/telemetry/telemetry.dart`).
      - apps/mobile/build/ios/archive/Runner.xcarchive/dSYMs/**
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Whether to submit for review is a human decision
        submit_to_app_store: false
      email:
        recipients:
          - k.fuke@emobi.co.jp
        notify:
          # TestFlight already notifies on success, so do not duplicate it
          success: false
          failure: true

  # ---------------------------------------------------------------------------
  # Android -> Google Play (internal track)
  #
  # iOS goes first, so there is no automatic trigger. It runs on a v* tag or from
  # "Start new build" in the Codemagic UI.
  # ---------------------------------------------------------------------------
  android-internal:
    name: Android — Play internal
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: *flutter_version
      java: 17
      groups:
        - mobile-dart-defines
        # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the Play Console service account)
        - google-play
      vars:
        # Used by assert_dart_defines to decide which RevenueCat key to require
        TARGET_PLATFORM: android
      android_signing:
        # The *name* of the keystore registered under Codemagic UI > Code signing identities
        - ai-sensei-upload-keystore

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - *assert_dart_defines
      - *assert_flutter_version
      - *pub_get
      - *build_runner
      - *analyze
      - *test

      - name: key.properties を書き出す
        working_directory: apps/mobile/android
        # android/app/build.gradle.kts reads this file for release signing.
        # Gradle also fails without a release signing config, but this states the cause first.
        script: |
          set -euo pipefail
          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "keystore が渡っていない。Codemagic の code signing identity を確認すること。"
            exit 1
          fi
          cat > key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      # AGP downloads the compileSdk 37 platform automatically.
      # A step aligning the directory name to android-37 used to live here, but the name
      # was not the problem, so it was removed (details in app/build.gradle.kts's compileSdkMinor).

      - name: AAB をビルド
        working_directory: apps/mobile
        script: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="${API_BASE_URL:?変数グループ mobile-dart-defines がこのビルドに渡っていない。Codemagic UI > このアプリ > Environment variables でグループ名と紐づけを確認すること}" \
            --dart-define=REVENUECAT_IOS_PUBLIC_SDK_KEY="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ANDROID_PUBLIC_SDK_KEY="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_SDK_KEY="${REVENUECAT_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ENTITLEMENT_ID="${REVENUECAT_ENTITLEMENT_ID:-premium}" \
            --dart-define=REVENUECAT_OFFERING_ID="${REVENUECAT_OFFERING_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-47044c5e-15eb-49ec-bdd4-e0ed2219a799}" \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-}" \
            --dart-define=TERMS_URL="${TERMS_URL:-}" \
            --dart-define=SUPPORT_EMAIL="${SUPPORT_EMAIL:-}"

    artifacts:
      - apps/mobile/build/app/outputs/bundle/release/*.aab
      - apps/mobile/build/app/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - k.fuke@emobi.co.jp
        notify:
          success: false
          failure: true
