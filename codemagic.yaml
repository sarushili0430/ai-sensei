# =============================================================================
# ai-sensei — Codemagic
# =============================================================================
# 役割分担:
#   GitHub Actions (.github/workflows/ci.yml)
#     … lint / typecheck / test / flutter analyze / golden test / シークレット走査
#   Codemagic (このファイル)
#     … 実機向けビルドと配布(TestFlight / Google Play)
#
# 検査をActions側に寄せているのは、Codemagicのmacインスタンスが従量課金だから。
# ここでは「壊れたものを配布しない」ために要る分だけを走らせる。
#
# Codemagic UI 側でやる設定(APIキー・keystore・変数グループ)は
# docs/ci/codemagic.md にまとめてある。
# このファイルを使うには Workflow Editor の "Switch to YAML configuration" が要る。
# =============================================================================

definitions:
  # Flutterのバージョンは apps/mobile/.fvmrc を正とする。
  # Codemagicは環境変数やファイルからSDKのバージョンを決められないので
  # ここは手で書き、ズレたら assert_flutter_version で落とす。
  flutter_version: &flutter_version 3.44.8

  scripts:
    # 最初に置いてある。ここで見ているのは変数グループ mobile-dart-defines の
    # 中身で、渡っていないことに気づけるのが最後の flutter build 時
    #   API_BASE_URL: unbound variable
    # だと、macの課金時間を10分以上使ってから落ちることになるため。
    - &assert_dart_defines
      name: dart-define に渡す環境変数が揃っているか
      script: |
        set -euo pipefail
        missing=""
        [ -n "${API_BASE_URL:-}" ] || missing="$missing API_BASE_URL"

        # RevenueCat の鍵は、そのworkflowが作る成果物のプラットフォームのものだけ見る。
        # ストアに商品を作る前は appl_ / goog_ の鍵がまだ無いので、
        # Test Store の鍵(REVENUECAT_SDK_KEY)でも通す —— アプリ側も
        # プラットフォーム別の鍵が空なら Test Store の鍵に落ちる作りになっている
        # (lib/src/features/monetization/data/revenuecat_config.dart の apiKeyFor)。
        case "${TARGET_PLATFORM:-}" in
          ios)     platform_key_name=REVENUECAT_IOS_PUBLIC_SDK_KEY;     platform_key="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" ;;
          android) platform_key_name=REVENUECAT_ANDROID_PUBLIC_SDK_KEY; platform_key="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" ;;
          *)
            echo "TARGET_PLATFORM が ios / android のどちらでもない: '${TARGET_PLATFORM:-}'"
            echo "codemagic.yaml の environment.vars で設定すること。"
            exit 1
            ;;
        esac
        if [ -z "$platform_key" ] && [ -z "${REVENUECAT_SDK_KEY:-}" ]; then
          missing="$missing ${platform_key_name}(または REVENUECAT_SDK_KEY)"
        fi

        if [ -n "$missing" ]; then
          echo "次の環境変数がビルドマシンに渡っていない:$missing"
          echo
          echo "Codemagic UI > このアプリ > Environment variables を開き、"
          echo "  - グループ名が mobile-dart-defines になっているか"
          echo "    (codemagic.yaml の environment.groups と完全一致が要る)"
          echo "  - 変数がそのグループに入っているか"
          echo "  - グループがこのアプリに紐づいているか"
          echo "を確認すること。"
          echo
          echo "いずれも公開鍵・公開URLなので secure にする必要はない。"
          exit 1
        fi

        if [ -z "$platform_key" ]; then
          echo "警告: ${platform_key_name} が空。Test Store の鍵で配布する。"
          echo "実売のビルドではない(アプリ内にもその旨が出る)。"
        fi
        echo "dart-define 用の環境変数は揃っている"

    - &assert_flutter_version
      name: .fvmrc とSDKのバージョンが一致しているか
      script: |
        set -euo pipefail
        pinned="$(python3 -c "import json;print(json.load(open('apps/mobile/.fvmrc'))['flutter'])")"
        actual="$(flutter --version --machine | python3 -c "import json,sys;print(json.load(sys.stdin)['frameworkVersion'])")"
        if [ "$pinned" != "$actual" ]; then
          echo "apps/mobile/.fvmrc は ${pinned} だが、このビルドは ${actual} で走っている。"
          echo "codemagic.yaml の definitions.flutter_version を ${pinned} に合わせること。"
          exit 1
        fi
        echo "Flutter ${actual} (.fvmrc と一致)"

    - &pub_get
      name: 依存の取得
      script: flutter pub get
      working_directory: apps/mobile

    - &build_runner
      name: コード生成 (freezed / json_serializable / riverpod)
      # 生成物(*.freezed.dart / *.g.dart)はコミットしないのでここで作る
      script: dart run build_runner build --delete-conflicting-outputs
      working_directory: apps/mobile

    - &analyze
      name: flutter analyze
      script: flutter analyze
      working_directory: apps/mobile

    - &test
      name: flutter test (golden以外)
      # golden は Linux のラスタライズを正とするので(test/golden/README.md)、
      # macインスタンスでは必ず落ちる。ここで見たいのは contract_fixture_test —
      # TypeScript側との契約がズレたまま配布するのを止めたい。
      script: flutter test --exclude-tags golden
      working_directory: apps/mobile

workflows:
  # ---------------------------------------------------------------------------
  # iOS → TestFlight
  #
  # develop に入ったものを内部テスターに配る。READMEのとおりiOS先行なので、
  # 自動で回すのはこのworkflowだけ。
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Codemagic UI > Settings > Integrations > Developer Portal で登録した
      # App Store Connect APIキーの「名前」。
      # ファイル名と同じ文字列だが無関係。Code signing identities に置いた
      # 証明書の名前(aisenseidist)でもない —— 書くと
      # App Store Connect integration "..." does not exist で落ちる。
      app_store_connect: codemagic

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        # API_BASE_URL / REVENUECAT_IOS_PUBLIC_SDK_KEY /
        # REVENUECAT_ANDROID_PUBLIC_SDK_KEY を入れておく変数グループ。
        # いずれも公開鍵・公開URLなので秘匿は不要(環境ごとに差し替えたいだけ)。
        - mobile-dart-defines
        # CERTIFICATE_PRIVATE_KEY(配布証明書に埋める秘密鍵)を入れておく変数グループ。
        # これだけは本物の秘密鍵なので **Secure** で登録すること。
        # 作り方と、なぜ要るかは docs/ci/codemagic.md の「2. iOS の署名」。
        - ios-code-signing
      vars:
        BUNDLE_ID: jp.co.aiSensei
        # OneSignal の Notification Service Extension のバンドルID。
        # ios/Runner.xcodeproj の NSE ターゲットの PRODUCT_BUNDLE_IDENTIFIER と
        # 揃えること。署名の検証ステップが、このIDのプロファイルも
        # ダウンロードされているかを見る。
        EXTENSION_BUNDLE_ID: jp.co.aiSensei.OneSignalNotificationServiceExtension
        # assert_dart_defines が、どちらのRevenueCat鍵を要求するかの判定に使う
        TARGET_PLATFORM: ios
        # OneSignal のネイティブ位置情報モジュール(OneSignalLocation)を
        # **リンクしない**。
        #
        # 入れたままだと CoreLocation を参照するコードがバイナリに残り、
        # アップロードのたびに App Store Connect から
        #   ITMS-90683: Missing purpose string in Info.plist
        #   (NSLocationWhenInUseUsageDescription)
        # がメールで返る。ビルドが緑のまま数十分後に届くので、
        # 気づくのは「配布したつもり」のあと —— だから元から断つ。
        #
        # このアプリは地理での出し分けを一切していない
        # (`push_repository.dart` が起動時に Location.setShared(false) を呼び、
        #  App のプライバシー申告でも位置情報は「収集しない」にしている)。
        # 用途が無いので、Info.plist に用途文言を足すほうの直し方は取れない。
        #
        # 値は onesignal_flutter の Package.swift / podspec / build.gradle が
        # **環境変数として**読む(`true` か `1` のときだけ効く)。
        # 効いたかどうかは下の検査ステップが見る。
        # 経緯は docs/ci/codemagic.md の「8. 位置情報を持ち込まない」。
        ONESIGNAL_DISABLE_LOCATION: "true"

      # environment.ios_signing は **わざと書いていない**。
      #
      # あれは名前に反して自動署名の設定ではなく、
      # 「**Codemagic UI にアップロード済みの**署名ファイルから、
      # distribution_type と bundle_identifier に合うものを探して使う」指定
      # (docs.codemagic.io/yaml-code-signing/signing-ios/ の "uploaded signing files")。
      # つまり手動署名で、UIに置いたファイルが正になる。
      #
      # 書いてあった頃は、Codemagic UI に手で上げた aisenseiprd が使われていた。
      # そのプロファイルは App Groups を持たないまま作られていたので、
      # NSE が入ったあと
      #   Provisioning profile "aisenseiprd" doesn't include the App Groups capability
      # で落ち、Developer Portal 側をいくら直しても直らなかった
      # (UIのファイルはPortalとは別物なので、Portalの変更が反映されない)。
      #
      # いまは下の scripts で app-store-connect fetch-signing-files を叩き、
      # **Apple から取得・生成する**。ios_signing を書き足すと両方式が混ざり、
      # No matching profiles found for bundle identifier ... で落ちるので足さないこと。

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
      # 連続pushで古いビルドを走らせ続けない(macの時間を食うだけなので)
      cancel_previous_builds: true

    scripts:
      - *assert_dart_defines
      - *assert_flutter_version
      - *pub_get
      - *build_runner
      - *analyze
      - *test

      # 署名は integrations.app_store_connect のAPIキーを使って、
      # ここで Apple から取得・生成する(Codemagicのいう automatic code signing)。
      # 組み込みステップに任せる書き方(environment.ios_signing)は
      # UIにアップロードしたファイルを使う別物なので、上の囲みのとおり使わない。

      - name: 署名ファイルを Apple から取得し Xcode プロジェクトに適用する
        working_directory: apps/mobile
        script: |
          set -euo pipefail

          # 秘密鍵が無いと fetch-signing-files は **毎ビルド新しい配布証明書を作る**。
          # Distribution 証明書はチームで持てる枚数に上限があるので、
          # 数回のビルドで上限に当たり、そこから先は発行そのものが失敗する。
          # 気づくのは上限に当たったあと —— なので先に見る。
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY が渡っていない。"
            echo "Codemagic UI > このアプリ > Environment variables で、"
            echo "  - グループ名が ios-code-signing になっているか"
            echo "  - そのグループがこのアプリに紐づいているか"
            echo "  - 値が Secure で入っているか"
            echo "を確認すること。作り方は docs/ci/codemagic.md の「2. iOS の署名」。"
            exit 1
          fi

          # ビルドマシンのキーチェーンを作り、署名に使える状態にする
          keychain initialize

          # Apple から証明書とプロファイルを取り、無ければ作る。
          # BUNDLE_ID は前方一致で照合されるので、
          # jp.co.aiSensei を渡せば拡張(jp.co.aiSensei.OneSignalNotificationServiceExtension)
          # のぶんも一緒に取れる —— ただし **Developer Portal にその Identifier がある場合だけ**。
          # 無ければ黙って本体のぶんだけ取ってくるので、下の検査で落とす。
          # (--strict-match-identifier を付けると本体だけになる。付けないこと)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

          # 取得した証明書をキーチェーンに入れる
          keychain add-certificates

          # プロファイルの保存先は cli-tools のバージョンで変わる
          # (いまは Xcode 側のディレクトリに入る)。use-profiles が既定で見るのと
          # **同じ2か所**をこちらも見ること。片方だけ見ていると、
          # 取得は成功しているのに「1つもダウンロードされていない」と誤診する。
          profile_dirs=(
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          )
          found=0
          for d in "${profile_dirs[@]}"; do
            if ls "$d"/*.mobileprovision >/dev/null 2>&1; then
              found=1
              echo "取得済みプロファイル ($d):"
              ls -1 "$d"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "プロビジョニングプロファイルが1つもダウンロードされていない。"
            echo "よくある原因:"
            echo "  - Developer Portal に ${BUNDLE_ID} のIdentifierが無い"
            echo "  - App Store Connect APIキー(integrations の 'codemagic')の権限が App Manager 未満"
            exit 1
          fi

          # プロファイルの中身まで検める。
          # Notification Service Extension が入って以降、「1枚でもあればOK」では
          # 足りなくなった。ここを素通りさせると、Xcodeのアーカイブを回しきった
          # あと(数分)に
          #   Provisioning profile "..." doesn't include the App Groups capability
          #   Signing for "OneSignalNotificationServiceExtension" requires a development team
          # が出る。どちらも直すのは Developer Portal 側なので、先に落とす。
          python3 - "$BUNDLE_ID" "$EXTENSION_BUNDLE_ID" "${profile_dirs[@]}" <<'PY'
          import glob, os, plistlib, subprocess, sys

          app_id, ext_id = sys.argv[1:3]
          profile_dirs = sys.argv[3:]

          # 要求している App Group は entitlements ファイルが正。
          # (NSE 側も同じ文字列を持つ決まりなので、本体のぶんだけ見れば足りる)
          with open("ios/Runner/Runner.entitlements", "rb") as f:
              wanted = set(plistlib.load(f).get("com.apple.security.application-groups", []))

          # バンドルID → そのプロファイルの素性。
          # 名前と App Group だけでは「Portal で消したはずのプロファイルが
          # また降ってきた」ときに何も分からないので、素性まで控えておく。
          profiles = {}
          paths = []
          for d in profile_dirs:
              paths += glob.glob(os.path.join(d, "*.mobileprovision"))
          for path in sorted(paths):
              raw = subprocess.run(["security", "cms", "-D", "-i", path],
                                   capture_output=True).stdout
              if not raw:
                  continue
              parsed = plistlib.loads(raw)
              ent = parsed.get("Entitlements", {})
              # application-identifier は "TEAMID.jp.co.aiSensei" の形
              bundle = ent.get("application-identifier", "").split(".", 1)[-1]
              profiles[bundle] = {
                  "name": parsed.get("Name", "?"),
                  "groups": set(ent.get("com.apple.security.application-groups", [])),
                  "team": ", ".join(parsed.get("TeamIdentifier", [])) or "?",
                  "created": str(parsed.get("CreationDate", "?"))[:19],
                  "uuid": parsed.get("UUID", "?"),
              }

          problems = []
          for target in (app_id, ext_id):
              hit = profiles.get(target)
              if hit is None:
                  # TEAMID.* のワイルドカードは App Groups を持てないので代用にならない
                  problems.append("%s のプロファイルが無い" % target)
                  continue
              missing = wanted - hit["groups"]
              if missing:
                  problems.append('%s のプロファイル "%s" に App Group %s が入っていない'
                                  % (target, hit["name"], ", ".join(sorted(missing))))

          if not problems:
              print("プロファイルは本体・拡張ぶん揃っており、App Group も入っている")
              sys.exit(0)

          for p in problems:
              print("NG: " + p)
          print("")
          print("Developer Portal (developer.apple.com) 側の設定が足りていない。")
          print("docs/ci/store-setup.md の 1-2-1 のとおりに直すこと:")
          print("  1. Identifiers > App Groups に %s を作る" % ", ".join(sorted(wanted)))
          print("  2. App ID %s の Capability で App Groups を有効にし、上のグループを割り当てる" % app_id)
          print("  3. App ID %s を Explicit で作り、同じく App Groups を割り当てる" % ext_id)
          print("  4. Profiles に残っている古いプロファイルを消す。")
          print("     fetch-signing-files は条件に合う既存のものがあればそれを使い、")
          print("     無いときだけ作る(--create)。Capability を足しても")
          print("     既存のプロファイルは古い内容のままなので、消さないと作り直されない。")
          print("")
          print("このビルドが見たプロファイル:")
          for bundle, info in sorted(profiles.items()):
              print("  %s" % bundle)
              print("      名前: %s" % info["name"])
              print("      App Groups: %s"
                    % (", ".join(sorted(info["groups"])) or "(無し)"))
              print("      Team: %s / 作成: %s" % (info["team"], info["created"]))
              print("      UUID: %s" % info["uuid"])
          print("")
          print("Portal で消したはずのプロファイルがまだ降ってくるときは、")
          print("上の Team と作成日で取得元を突き止めること:")
          print("  - 作成日がこのビルドの時刻 → fetch-signing-files が作ったもの。")
          print("    それでも App Groups が空なら、App ID 側の Capability が")
          print("    保存されていない(Edit でグループを選んだあと Save したか)。")
          print("  - 作成日がもっと前 → Portal に古いものが残っている。")
          print("    Profiles 画面のフィルタ(All / Development / Distribution)も疑う。")
          print("  - Team が Portal の画面右上に出ているものと違う")
          print("    → App Store Connect APIキー(integrations の 'codemagic')が")
          print("      別チームのもの。そのチームには App Group も拡張のIdentifierも無いので、")
          print("      何度直しても直らない。APIキーを作り直すこと。")
          sys.exit(1)
          PY

          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --export-options-plist "$HOME/export_options.plist"

          echo "--- $HOME/export_options.plist ---"
          cat "$HOME/export_options.plist"

      - name: IPA をビルド
        working_directory: apps/mobile
        script: |
          set -euo pipefail
          # バージョン名(1.2.3の側)は pubspec.yaml の version が正。
          # ビルド番号だけ Codemagic の連番で上書きする
          # (TestFlightは同じビルド番号の再アップロードを受け付けないため)。
          # 未設定の変数があっても set -u で落とさない。何が要るかは
          # assert_dart_defines で先に見ており、ここは素通しでよい。
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="${API_BASE_URL:?変数グループ mobile-dart-defines がこのビルドに渡っていない。Codemagic UI > このアプリ > Environment variables でグループ名と紐づけを確認すること}" \
            --dart-define=REVENUECAT_IOS_PUBLIC_SDK_KEY="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ANDROID_PUBLIC_SDK_KEY="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_SDK_KEY="${REVENUECAT_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ENTITLEMENT_ID="${REVENUECAT_ENTITLEMENT_ID:-premium}" \
            --dart-define=REVENUECAT_OFFERING_ID="${REVENUECAT_OFFERING_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-47044c5e-15eb-49ec-bdd4-e0ed2219a799}" \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-}" \
            --dart-define=TERMS_URL="${TERMS_URL:-}" \
            --dart-define=SUPPORT_EMAIL="${SUPPORT_EMAIL:-}" \
            --export-options-plist="$HOME/export_options.plist"

      # できあがったバイナリに **位置情報のAPIが混じっていないか**を最後に検める。
      #
      # ITMS-90683 は、アップロード自体は成功したあとにメールで返ってくる種類の
      # 指摘なので、ビルドは緑・TestFlightにも並ぶ、という状態で見落とせる。
      # 上の ONESIGNAL_DISABLE_LOCATION が(キャッシュや変数の消失で)効かなかった
      # ときに気づけるのがここ。
      #
      # 判定は Apple と同じ規則にしてある:
      #   バイナリが CoreLocation を参照している **かつ**
      #   Info.plist に NSLocationWhenInUseUsageDescription が無い → NG。
      # 将来ほんとうに位置情報を使うことになったら、用途文言を足せばここは通る。
      - name: 位置情報のAPIを持ち込んでいないか (ITMS-90683)
        working_directory: apps/mobile
        script: |
          set -euo pipefail

          app="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$app" ]; then
            echo "アーカイブが見つからない: $app"
            echo "flutter build ipa の出力先が変わった可能性がある。"
            exit 1
          fi

          # 本体・埋め込みframework・拡張(.appex)を区別せず、
          # .app の中の Mach-O を全部見る。CoreLocation を使うコードは、
          # 静的リンクでもアプリ本体の LC_LOAD_DYLIB に現れる。
          hits="$(mktemp)"
          find "$app" -type f -print | while IFS= read -r f; do
            if file -b "$f" | grep -q "Mach-O"; then
              if otool -L "$f" 2>/dev/null | grep -q "/CoreLocation\.framework/"; then
                printf '%s\n' "${f#$app/}" >> "$hits"
              fi
            fi
          done

          if [ ! -s "$hits" ]; then
            echo "CoreLocation を参照しているバイナリは無い。ITMS-90683 は出ない。"
            exit 0
          fi

          # 参照があっても、用途文言があるならAppleの規則上は正しい状態。
          if plutil -extract NSLocationWhenInUseUsageDescription raw -o - \
               "$app/Info.plist" >/dev/null 2>&1; then
            echo "CoreLocation を参照しているが、用途文言(NSLocationWhenInUseUsageDescription)はある。"
            echo "参照しているバイナリ:"
            sed 's/^/  /' "$hits"
            exit 0
          fi

          echo "NG: CoreLocation を参照しているのに、Info.plist に"
          echo "    NSLocationWhenInUseUsageDescription が無い。"
          echo "    このままアップロードすると ITMS-90683 がメールで返る。"
          echo ""
          echo "参照しているバイナリ:"
          sed 's/^/  /' "$hits"
          echo ""
          if grep -q "OneSignalLocation" "$hits"; then
            echo "OneSignalLocation が居る = 環境変数 ONESIGNAL_DISABLE_LOCATION が"
            echo "このビルドに効いていない。読まれるのは依存を**解決するとき**なので、"
            echo "SwiftPM / DerivedData のキャッシュを持ち回っていると復活する。"
            echo "codemagic.yaml の environment.vars と、キャッシュ設定を見ること。"
          else
            echo "OneSignal 以外のSDKが持ち込んでいる。そのSDKを外すか、"
            echo "**実際にその機能を使う場合にかぎり** Info.plist に用途文言を足す"
            echo "(使わないのに足すのは、App のプライバシー申告と食い違う)。"
          fi
          echo "経緯は docs/ci/codemagic.md の「8. 位置情報を持ち込まない」。"
          exit 1

    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      # クラッシュのシンボル化(Sentry)に要る。
      # **送り先が入るまでは、シンボルだけ集めている状態**だった(計画書 §10-7)。
      # いまは `--dart-define=SENTRY_DSN` を渡しているので、変数グループに
      # 値が入った時点で対になる。DSN が空のビルドでは監視ごと無効
      # (`src/telemetry/telemetry.dart` の `SentryConfig`)。
      - apps/mobile/build/ios/archive/Runner.xcarchive/dSYMs/**
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 審査に出すかどうかは人が決める
        submit_to_app_store: false
      email:
        recipients:
          - k.fuke@emobi.co.jp
        notify:
          # 成功は TestFlight の通知が来るので二重にしない
          success: false
          failure: true

  # ---------------------------------------------------------------------------
  # Android → Google Play (internal track)
  #
  # iOS先行なので自動トリガは付けない。v* タグを打ったときか、
  # Codemagic UI の "Start new build" のときだけ走る。
  # ---------------------------------------------------------------------------
  android-internal:
    name: Android — Play internal
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: *flutter_version
      java: 17
      groups:
        - mobile-dart-defines
        # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS(Play Consoleのサービスアカウント)
        - google-play
      vars:
        # assert_dart_defines が、どちらのRevenueCat鍵を要求するかの判定に使う
        TARGET_PLATFORM: android
        # iOS側と同じ理由で OneSignal の位置情報モジュールを外す。
        # Androidではこのモジュールが ACCESS_COARSE_LOCATION /
        # ACCESS_FINE_LOCATION を最終マニフェストに混ぜてくるので、
        # 外さないと Play Console のデータセーフティ申告
        # (docs/ci/store-setup.md の 2-6)と食い違う。
        ONESIGNAL_DISABLE_LOCATION: "true"
      android_signing:
        # Codemagic UI > Code signing identities に登録した keystore の「名前」
        - ai-sensei-upload-keystore

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - *assert_dart_defines
      - *assert_flutter_version
      - *pub_get
      - *build_runner
      - *analyze
      - *test

      - name: key.properties を書き出す
        working_directory: apps/mobile/android
        # android/app/build.gradle.kts がこのファイルを読んでリリース署名に使う。
        # Release署名が無ければGradle側も失敗するが、ここで先に原因を明示する。
        script: |
          set -euo pipefail
          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "keystore が渡っていない。Codemagic の code signing identity を確認すること。"
            exit 1
          fi
          cat > key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      # compileSdk 37 のプラットフォームは AGP が自動でダウンロードする。
      # ディレクトリ名を android-37 に揃えるステップがここにあったが、
      # 名前の問題ではなかったので消した(詳細は app/build.gradle.kts の compileSdkMinor)。

      - name: AAB をビルド
        working_directory: apps/mobile
        script: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="${API_BASE_URL:?変数グループ mobile-dart-defines がこのビルドに渡っていない。Codemagic UI > このアプリ > Environment variables でグループ名と紐づけを確認すること}" \
            --dart-define=REVENUECAT_IOS_PUBLIC_SDK_KEY="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ANDROID_PUBLIC_SDK_KEY="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_SDK_KEY="${REVENUECAT_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ENTITLEMENT_ID="${REVENUECAT_ENTITLEMENT_ID:-premium}" \
            --dart-define=REVENUECAT_OFFERING_ID="${REVENUECAT_OFFERING_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-47044c5e-15eb-49ec-bdd4-e0ed2219a799}" \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-}" \
            --dart-define=TERMS_URL="${TERMS_URL:-}" \
            --dart-define=SUPPORT_EMAIL="${SUPPORT_EMAIL:-}"

    artifacts:
      - apps/mobile/build/app/outputs/bundle/release/*.aab
      - apps/mobile/build/app/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - k.fuke@emobi.co.jp
        notify:
          success: false
          failure: true
