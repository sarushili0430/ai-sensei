# pre-commit for apps/mobile/, pulled in from the root lefthook.yml via extends.
#
# `root:` is set, so the job is skipped when nothing under `apps/mobile/` is
# staged (it does not run on backend-only commits).
#
# flutter analyze works per package rather than per file, so {staged_files} is
# not passed; the glob only decides whether anything changed.
pre-commit:
  jobs:
    - name: mobile-lint
      root: "apps/mobile/"
      glob: "*.{dart,yaml}"
      # The SDK is pinned with fvm (.fvmrc). Use fvm's SDK when installed, and
      # fall back to plain flutter for manual installs and CI containers.
      run: |
        if [ -d .fvm/flutter_sdk ] && command -v fvm >/dev/null 2>&1; then
          fvm flutter analyze
        else
          flutter analyze
        fi
