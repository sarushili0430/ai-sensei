# pre-commit for backend/. Loaded from the root lefthook.yml via extends.
#
# `root:` is set, so this job is skipped when no staged file lives under
# `backend/`. {staged_files} is also relative to backend/.
pre-commit:
  jobs:
    - name: backend-lint
      root: "backend/"
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      # The same check as the root `pnpm run lint` (= biome ci .), applied only to
      # touched files. The config comes from the root biome.json.
      run: pnpm exec biome ci {staged_files}
