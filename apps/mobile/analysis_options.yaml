include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Build output. In CI the iOS signing step (xcode-project use-profiles runs
    # xcodebuild internally) expands Swift Packages into
    # build/ios/SourcePackages/ before flutter analyze. Those include the
    # dependencies' own example apps, which import packages our pubspec does not
    # have, so without this exclusion analyze fails on someone else's code.
    - build/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    - require_trailing_commas
