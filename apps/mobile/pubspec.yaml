name: ai_sensei
description: 数学の「わかったつもり」を、声に出して説明させて見つけるアプリ。
publish_to: "none"
version: 0.1.0+1

environment:
  # The Flutter version is pinned in .fvmrc (fvm use); this is the lower bound.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Models (freezed + json_serializable)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.11.0

  # Navigation
  go_router: ^17.4.0

  # Camera
  camera: ^0.12.0
  image_picker: ^1.1.2

  # Realtime conversation.
  # Board delivery rides the Text Streams API (registerTextStreamHandler). Raw
  # publishData defaults reliable to false, and forgetting that delivers board
  # lines missing or out of order. The design was checked against 2.10.0's
  # source, so the lower bound matches; ^2.3.5 could resolve to an older version
  # on a clean pub get.
  livekit_client: ^2.10.0
  permission_handler: ^13.0.0

  # Billing / notifications / monitoring
  purchases_flutter: ^10.7.0
  # RevenueCat's paywall and Customer Center. Kept at the same version as the
  # core; bumping one alone desyncs the native side.
  purchases_ui_flutter: ^10.7.0
  onesignal_flutter: ^5.2.6
  # 8.x resolves sentry-cocoa without an upper bound over SPM and breaks the
  # build; 9.x pins cocoa exactly, so we stay on 9 or later.
  sentry_flutter: ^9.26.0

  http: ^1.2.2
  # For setting the Content-Type on photo uploads (MediaType). A transitive
  # dependency of http, but declared here because we use it directly.
  http_parser: ^4.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

  # The minimum needed to leave settings: privacy policy, terms, and the mailto
  # for reporting inappropriate questions.
  url_launcher: ^6.3.1
  # Support asks for it, so the version is shown in settings.
  package_info_plus: ^9.0.0

  # LaTeX rendering for the board layer. Chosen after a measured spike (about 30
  # formulas checked by eye, none broken). The thin-maintenance risk is covered
  # by the allowed-command check in `packages/guardrail` and the agent's KaTeX
  # parse, rather than by constraining this package.
  flutter_math_fork: ^0.7.4
  # Board constructions (`figure`). Only SVG the server solved and rendered ever
  # arrives — senpai's own SVG cannot enter by any path
  # (`packages/contract/src/board.ts`). The device only draws it, so this does
  # not change as the figure vocabulary grows.
  flutter_svg: ^2.0.10
  # The lesson's short opening line plays a bundled asset only. No URL is passed,
  # so there is neither a request nor metered TTS cost.
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  # 3.2.6 is dev-prerelease only; capped so we stay on stable releases.
  freezed: ">=3.0.0 <3.2.6"
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.0

  # riverpod_lint 3.1 moved from custom_lint to analysis_server_plugin, so
  # custom_lint is unnecessary; keeping it pins analyzer to 8.x and blocks other
  # upgrades.
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    # The current m4a files are silent placeholders; the README in that directory
    # covers swapping in real audio. Declaring the directory means neither locale
    # can be forgotten.
    - assets/audio/
  fonts:
    # Rounded gothic, SIL OFL 1.1. Golden tests render with this font, so a
    # missing file fails them — which is how we find out.
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Regular.ttf
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
