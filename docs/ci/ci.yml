name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (workers / agent / packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  flutter:
    name: Flutter (apps/mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: apps/mobile

      - run: flutter analyze
        working-directory: apps/mobile

      # contract_fixture_test.dart が packages/contract/fixtures を読むので、
      # TypeScript側と同じ契約で通ることをここで確かめる
      - run: flutter test
        working-directory: apps/mobile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # publicリポジトリなので、鍵の混入は1コミットでも致命傷になる。
      # 依存のインストールなしで走らせたいため npm ci は挟まない。
      - name: Scan tracked files for secrets
        run: npm run verify:secrets
