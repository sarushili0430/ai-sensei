# backend/api(Cloudflare Workers)のデプロイ。
#
#   develop ブランチ → develop 環境 (ai-sensei-api-develop)
#   main    ブランチ → production 環境 (ai-sensei-api-production)
#
# 環境の定義は backend/api/wrangler.toml、初回セットアップは docs/deploy.md。
# apps/mobile の配布は Codemagic 側(codemagic.yaml)なのでここでは扱わない。
name: Deploy (backend/api)

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/api/**"
      - "packages/**"
      - "prompts/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy.yml"
  # 手で流し直す用(コード変更なしの再デプロイ・secret入れ替え後など)
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先"
        type: choice
        options: [develop, production]
        default: develop

# 同じブランチのデプロイは直列にする。走っているデプロイは**止めない**
# (マイグレーションだけ当たってdeployが飛んだ状態がいちばん厄介なので)。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
    runs-on: ubuntu-latest

    # GitHub Environments。production に承認を挟みたくなったら、
    # Settings > Environments > production に required reviewers を足す。
    environment:
      name: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
      url: ${{ steps.deploy.outputs.url }}

    env:
      TARGET: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # プレースホルダのまま deploy すると、Cloudflare からは
      # 「そんなリソースは無い」という分かりにくいエラーが返る。手前で落とす。
      - name: Check bindings are filled in
        run: |
          if grep -n "REPLACE_ME" backend/api/wrangler.toml; then
            echo "::error file=backend/api/wrangler.toml::D1/KV のIDが未設定です。docs/deploy.md の手順で差し替えてください。"
            exit 1
          fi

      # CIワークフローと重複するが、デプロイは単体で完結させる。
      # 「CIは緑だったが、その後のpushで壊れたものが出ていった」を防ぐため。
      - name: Verify (lint / typecheck / secret scan / test)
        run: pnpm run verify

      # コードより先にスキーマを当てる。適用済みのマイグレーションは
      # d1_migrations テーブルで管理されるので、再実行しても二重には当たらない。
      - name: Apply D1 migrations
        run: pnpm --filter @ai-sensei/api run "migrate:$TARGET"

      - name: Deploy
        id: deploy
        shell: bash
        run: |
          # wrangler は行によって stdout/stderr を使い分けるので、両方拾う
          pnpm --filter @ai-sensei/api run "deploy:$TARGET" 2>&1 | tee deploy.log
          # workers.dev でも独自ドメインでも、wrangler は triggers に URL を出す。
          # ドキュメント/ダッシュボードへの案内リンクは拾わない。
          # 1つも取れなくてもここでは落とさない(デプロイ自体は成功しているため)。
          # pipefail が効いているので、空振りのgrepを `|| true` で吸収する。
          url="$(grep -oE 'https://[A-Za-z0-9._-]+(/\*)?' deploy.log \
            | grep -vE 'cloudflare\.com|github\.com' \
            | tail -1 | sed 's#/\*$##' || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # develop と production は見た目が同じなので、/health が名乗る環境名まで見る。
      - name: Smoke check
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          if [ -z "$url" ]; then
            echo "::warning::デプロイ出力からURLを取れなかったので /health の確認を飛ばします"
            exit 0
          fi
          # デプロイ直後は伝播待ちがあるので数回リトライする
          body="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url/health")"
          echo "$body"
          if ! grep -q "\"environment\":\"$TARGET\"" <<<"$body"; then
            echo "::error::$url/health が名乗る環境が $TARGET ではありません"
            exit 1
          fi
          echo "✔ $TARGET → $url"
