name: ai_sensei
description: 数学の「わかったつもり」を、声に出して説明させて見つけるアプリ。
publish_to: "none"
version: 0.1.0+1

environment:
  # Flutterのバージョンは .fvmrc で固定する(fvm use)。
  # ここは「このSDK以上なら動く」下限。
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状態管理 / DI
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # モデル定義(freezed + json_serializable)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.11.0

  # 画面遷移
  go_router: ^17.4.0

  # 撮影
  camera: ^0.12.0
  image_picker: ^1.1.2
  # 写真の切り抜き。
  #
  # **iOSがSPMに対応しているのが決め手**(`ios/image_cropper/Package.swift`。
  # 中身は TOCropViewController)。このアプリは Podfile を持たずSPMで組んで
  # いるので、切り抜きのためだけにCocoaPodsを生やさずに済む。
  # Androidは AndroidManifest に UCropActivity を1つ足すだけ(権限は増えない)。
  #
  # 出力は既定でJPEG(compressQuality 90)なので、`api_client.dart` が
  # Content-Type を image/jpeg 決め打ちしているのとも噛み合う。
  image_cropper: ^12.2.1

  # リアルタイム会話
  # 板書の受信は Text Streams API(registerTextStreamHandler)に乗っている。
  # 生の publishData は reliable の既定が false で、書き忘れると板書が欠落・順不同で
  # 届く(docs/pivot_plan_v1.md §3-5)。そのAPIを 2.10.0 のソースで確認して設計したので、
  # 宣言の下限も 2.10.0 に合わせる。^2.3.5 のままだとクリーンな pub get で
  # 古い版に解決されうる。
  livekit_client: ^2.10.0
  permission_handler: ^13.0.0

  # 課金 / 通知 / 監視
  purchases_flutter: ^10.7.0
  # RevenueCatのペイウォールとCustomer Center。
  # コアと同じバージョンで揃える(片方だけ上げるとネイティブ側が食い違う)。
  purchases_ui_flutter: ^10.7.0
  onesignal_flutter: ^5.2.6
  # 8.x はSPM経由だとsentry-cocoaを上限なしで解決してビルドが壊れる。
  # 9.x はcocoaを exact 指定しているのでそれ以降に上げる。
  sentry_flutter: ^9.26.0

  http: ^1.2.2
  # 写真を送るときの Content-Type を明示するため(MediaType)。
  # http の推移的依存だが、直接使うので自分でも宣言しておく。
  http_parser: ^4.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

  # 設定画面から外に出るための最小限。
  # プライバシーポリシー・利用規約・不適切な質問の報告(mailto)を開く。
  url_launcher: ^6.3.1
  # 問い合わせのときに聞かれるので、設定画面にバージョンを出す。
  package_info_plus: ^9.0.0

  # 板書レイヤーのLaTeX描画(計画書§3-5・§3-6)。
  # 実測スパイクで採否判定済み(§3-6。約30式を目視確認・崩れ0件)。
  # メンテが薄いリスクへの保険は `packages/guardrail` の許可コマンド照合と
  # agent側のKaTeXパースで取る(§3-6の三段構え。このパッケージ自体は縛らない)。
  flutter_math_fork: ^0.7.4
  # 板書の作図(`figure`)。**SVGはサーバが解いて描いたものだけが届く**
  # (先輩が書いたSVGはどの経路でも入らない。`packages/contract/src/board.ts`)。
  # 端末側はこれを描くだけなので、図の語彙が増えてもここは変わらない
  # (docs/wireframe_board_v2.html D-21)。
  flutter_svg: ^2.0.10
  # 授業冒頭の短い一言は、同梱アセットだけを再生する。
  # URLを渡さないので通信もTTS従量原価も発生しない(計画書§3-2)。
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # コード生成
  build_runner: ^2.4.13
  # 3.2.6 はまだ dev プレリリースしか無い。安定版だけを使いたいので上限を切る。
  freezed: ">=3.0.0 <3.2.6"
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.0

  # riverpod_lint 3.1 で custom_lint から analysis_server_plugin に移行したので
  # custom_lint は不要。残しておくと analyzer 8 系に固定されて他が上げられない。
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    # 現在の m4a は無音プレースホルダ。実音声への差し替え手順は同ディレクトリの
    # README に置く。ディレクトリ指定なので、日英の片方を宣言し忘れない。
    - assets/audio/
  fonts:
    # 丸ゴシック。SIL OFL 1.1。
    # golden test はこのフォントを読み込んで描画するので、
    # ファイルが欠けるとテストが落ちる(= 気づける)。
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Regular.ttf
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
