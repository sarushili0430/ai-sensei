# =============================================================================
# ai-sensei — Codemagic
# =============================================================================
# 役割分担:
#   GitHub Actions (.github/workflows/ci.yml)
#     … lint / typecheck / test / flutter analyze / golden test / シークレット走査
#   Codemagic (このファイル)
#     … 実機向けビルドと配布(TestFlight / Google Play)
#
# 検査をActions側に寄せているのは、Codemagicのmacインスタンスが従量課金だから。
# ここでは「壊れたものを配布しない」ために要る分だけを走らせる。
#
# Codemagic UI 側でやる設定(APIキー・keystore・変数グループ)は
# docs/ci/codemagic.md にまとめてある。
# このファイルを使うには Workflow Editor の "Switch to YAML configuration" が要る。
# =============================================================================

definitions:
  # Flutterのバージョンは apps/mobile/.fvmrc を正とする。
  # Codemagicは環境変数やファイルからSDKのバージョンを決められないので
  # ここは手で書き、ズレたら assert_flutter_version で落とす。
  flutter_version: &flutter_version 3.44.8

  scripts:
    # 最初に置いてある。ここで見ているのは変数グループ mobile-dart-defines の
    # 中身で、渡っていないことに気づけるのが最後の flutter build 時
    #   API_BASE_URL: unbound variable
    # だと、macの課金時間を10分以上使ってから落ちることになるため。
    - &assert_dart_defines
      name: dart-define に渡す環境変数が揃っているか
      script: |
        set -euo pipefail
        missing=""
        [ -n "${API_BASE_URL:-}" ] || missing="$missing API_BASE_URL"

        # RevenueCat の鍵は、そのworkflowが作る成果物のプラットフォームのものだけ見る。
        # ストアに商品を作る前は appl_ / goog_ の鍵がまだ無いので、
        # Test Store の鍵(REVENUECAT_SDK_KEY)でも通す —— アプリ側も
        # プラットフォーム別の鍵が空なら Test Store の鍵に落ちる作りになっている
        # (lib/src/features/monetization/data/revenuecat_config.dart の apiKeyFor)。
        case "${TARGET_PLATFORM:-}" in
          ios)     platform_key_name=REVENUECAT_IOS_PUBLIC_SDK_KEY;     platform_key="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" ;;
          android) platform_key_name=REVENUECAT_ANDROID_PUBLIC_SDK_KEY; platform_key="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" ;;
          *)
            echo "TARGET_PLATFORM が ios / android のどちらでもない: '${TARGET_PLATFORM:-}'"
            echo "codemagic.yaml の environment.vars で設定すること。"
            exit 1
            ;;
        esac
        if [ -z "$platform_key" ] && [ -z "${REVENUECAT_SDK_KEY:-}" ]; then
          missing="$missing ${platform_key_name}(または REVENUECAT_SDK_KEY)"
        fi

        if [ -n "$missing" ]; then
          echo "次の環境変数がビルドマシンに渡っていない:$missing"
          echo
          echo "Codemagic UI > このアプリ > Environment variables を開き、"
          echo "  - グループ名が mobile-dart-defines になっているか"
          echo "    (codemagic.yaml の environment.groups と完全一致が要る)"
          echo "  - 変数がそのグループに入っているか"
          echo "  - グループがこのアプリに紐づいているか"
          echo "を確認すること。"
          echo
          echo "いずれも公開鍵・公開URLなので secure にする必要はない。"
          exit 1
        fi

        if [ -z "$platform_key" ]; then
          echo "警告: ${platform_key_name} が空。Test Store の鍵で配布する。"
          echo "実売のビルドではない(アプリ内にもその旨が出る)。"
        fi
        echo "dart-define 用の環境変数は揃っている"

    - &assert_flutter_version
      name: .fvmrc とSDKのバージョンが一致しているか
      script: |
        set -euo pipefail
        pinned="$(python3 -c "import json;print(json.load(open('apps/mobile/.fvmrc'))['flutter'])")"
        actual="$(flutter --version --machine | python3 -c "import json,sys;print(json.load(sys.stdin)['frameworkVersion'])")"
        if [ "$pinned" != "$actual" ]; then
          echo "apps/mobile/.fvmrc は ${pinned} だが、このビルドは ${actual} で走っている。"
          echo "codemagic.yaml の definitions.flutter_version を ${pinned} に合わせること。"
          exit 1
        fi
        echo "Flutter ${actual} (.fvmrc と一致)"

    - &pub_get
      name: 依存の取得
      script: flutter pub get
      working_directory: apps/mobile

    - &build_runner
      name: コード生成 (freezed / json_serializable / riverpod)
      # 生成物(*.freezed.dart / *.g.dart)はコミットしないのでここで作る
      script: dart run build_runner build --delete-conflicting-outputs
      working_directory: apps/mobile

    - &analyze
      name: flutter analyze
      script: flutter analyze
      working_directory: apps/mobile

    - &test
      name: flutter test (golden以外)
      # golden は Linux のラスタライズを正とするので(test/golden/README.md)、
      # macインスタンスでは必ず落ちる。ここで見たいのは contract_fixture_test —
      # TypeScript側との契約がズレたまま配布するのを止めたい。
      script: flutter test --exclude-tags golden
      working_directory: apps/mobile

workflows:
  # ---------------------------------------------------------------------------
  # iOS → TestFlight
  #
  # develop に入ったものを内部テスターに配る。READMEのとおりiOS先行なので、
  # 自動で回すのはこのworkflowだけ。
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Codemagic UI > Settings > Integrations > Developer Portal で登録した
      # App Store Connect APIキーの「名前」。
      # ファイル名と同じ文字列だが無関係。Code signing identities に置いた
      # 証明書の名前(aisenseidist)でもない —— 書くと
      # App Store Connect integration "..." does not exist で落ちる。
      app_store_connect: codemagic

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        # API_BASE_URL / REVENUECAT_IOS_PUBLIC_SDK_KEY /
        # REVENUECAT_ANDROID_PUBLIC_SDK_KEY を入れておく変数グループ。
        # いずれも公開鍵・公開URLなので秘匿は不要(環境ごとに差し替えたいだけ)。
        - mobile-dart-defines
      vars:
        BUNDLE_ID: jp.co.aiSensei
        # assert_dart_defines が、どちらのRevenueCat鍵を要求するかの判定に使う
        TARGET_PLATFORM: ios
      ios_signing:
        # 自動コードサイニング。上の integrations.app_store_connect のAPIキーで
        # プロファイルと証明書を取得し、Xcodeプロジェクトに適用するところまでを
        # スクリプトより前にCodemagicがやる。
        distribution_type: app_store
        # ここは環境変数の展開が効かないので BUNDLE_ID とは別に直書きする。
        # 変えるときは vars.BUNDLE_ID と一緒に直すこと。
        bundle_identifier: jp.co.aiSensei

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
      # 連続pushで古いビルドを走らせ続けない(macの時間を食うだけなので)
      cancel_previous_builds: true

    scripts:
      - *assert_dart_defines
      - *assert_flutter_version
      - *pub_get
      - *build_runner
      - *analyze
      - *test

      # 署名は environment.ios_signing に任せている。
      # キーチェーンの初期化・証明書の取得・プロファイルの適用・
      # /Users/builder/export_options.plist の生成まで、
      # scripts が始まる前に Codemagic の組み込みステップが済ませる。
      #
      # 以前はここで keychain initialize + fetch-signing-files --create を
      # 手で叩いていたが、自動署名と併用すると壊れる:
      # keychain initialize が自動署名の入れた証明書を消し、そのあと
      # --create が Developer Portal にある既存の配布証明書を拾ってきても
      # **その秘密鍵はこのマシンに無い**ので
      #   Cannot save Signing Certificates without certificate private key
      # で落ちる。
      #
      # 証明書を作り直す必要が出たときは、使い回す秘密鍵を
      # 環境変数 CERTIFICATE_PRIVATE_KEY に入れたうえで
      #   app-store-connect fetch-signing-files "$BUNDLE_ID" \
      #     --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
      # を一時的に足す。鍵を渡さないと毎ビルド新しい証明書を作って上限に当たる。

      - name: 署名をXcodeプロジェクトに適用し export_options.plist を作る
        working_directory: apps/mobile
        # 組み込みステップの最後(xcode-project use-profiles)がこれをやる —— はずだが、
        # 探し方が「クローン先ルートからの **/*.xcodeproj」なので、
        # このリポジトリのように iOS プロジェクトが apps/mobile/ios にある構成では
        # 見つけられずに素通りすることがある。そのときは何も言わずに次へ進み、
        # 最後の flutter build ipa が
        #   "/Users/builder/export_options.plist" property list does not exist
        # で落ちる —— macの課金時間を全部使いきったあとで。
        #
        # なのでプロジェクトのパスを明示して自分で叩く。
        # use-profiles は冪等なので、組み込みステップが済ませていても実害はない。
        script: |
          set -euo pipefail
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"

          # 組み込みの自動署名がプロファイルを取れていないと use-profiles は
          # "Did not find any provisioning profiles" で落ちる。
          # そのとき直すべきなのはこのステップではなく Developer Portal 側
          # (バンドルIDの登録・APIキーの権限)なので、先に切り分けておく。
          if ! ls "$profiles_dir"/*.mobileprovision >/dev/null 2>&1; then
            echo "プロビジョニングプロファイルが1つもダウンロードされていない。"
            echo "scripts より前にある Codemagic の署名ステップのログを見ること。"
            echo "よくある原因:"
            echo "  - Developer Portal に ${BUNDLE_ID} のIdentifierが無い"
            echo "  - App Store Connect APIキー(integrations の 'codemagic')の権限が App Manager 未満"
            echo "  - environment.ios_signing.bundle_identifier がアプリのバンドルIDと違う"
            exit 1
          fi
          echo "取得済みプロファイル:"
          ls -1 "$profiles_dir"

          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --export-options-plist "$HOME/export_options.plist"

          echo "--- $HOME/export_options.plist ---"
          cat "$HOME/export_options.plist"

      - name: IPA をビルド
        working_directory: apps/mobile
        script: |
          set -euo pipefail
          # バージョン名(1.2.3の側)は pubspec.yaml の version が正。
          # ビルド番号だけ Codemagic の連番で上書きする
          # (TestFlightは同じビルド番号の再アップロードを受け付けないため)。
          # 未設定の変数があっても set -u で落とさない。何が要るかは
          # assert_dart_defines で先に見ており、ここは素通しでよい。
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="${API_BASE_URL:?変数グループ mobile-dart-defines がこのビルドに渡っていない。Codemagic UI > このアプリ > Environment variables でグループ名と紐づけを確認すること}" \
            --dart-define=REVENUECAT_IOS_PUBLIC_SDK_KEY="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ANDROID_PUBLIC_SDK_KEY="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_SDK_KEY="${REVENUECAT_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ENTITLEMENT_ID="${REVENUECAT_ENTITLEMENT_ID:-premium}" \
            --dart-define=REVENUECAT_OFFERING_ID="${REVENUECAT_OFFERING_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-}" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-}" \
            --dart-define=TERMS_URL="${TERMS_URL:-}" \
            --dart-define=SUPPORT_EMAIL="${SUPPORT_EMAIL:-}" \
            --export-options-plist=/Users/builder/export_options.plist
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      # クラッシュのシンボル化(Sentry)に要る
      - apps/mobile/build/ios/archive/Runner.xcarchive/dSYMs/**
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 審査に出すかどうかは人が決める
        submit_to_app_store: false
      email:
        recipients:
          - k.fuke@emobi.co.jp
        notify:
          # 成功は TestFlight の通知が来るので二重にしない
          success: false
          failure: true

  # ---------------------------------------------------------------------------
  # Android → Google Play (internal track)
  #
  # iOS先行なので自動トリガは付けない。v* タグを打ったときか、
  # Codemagic UI の "Start new build" のときだけ走る。
  # ---------------------------------------------------------------------------
  android-internal:
    name: Android — Play internal
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: *flutter_version
      java: 17
      groups:
        - mobile-dart-defines
        # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS(Play Consoleのサービスアカウント)
        - google-play
      vars:
        # assert_dart_defines が、どちらのRevenueCat鍵を要求するかの判定に使う
        TARGET_PLATFORM: android
      android_signing:
        # Codemagic UI > Code signing identities に登録した keystore の「名前」
        - ai-sensei-upload-keystore

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - *assert_dart_defines
      - *assert_flutter_version
      - *pub_get
      - *build_runner
      - *analyze
      - *test

      - name: key.properties を書き出す
        working_directory: apps/mobile/android
        # android/app/build.gradle.kts がこのファイルを読んでリリース署名に使う。
        # 無いときは debug 署名にフォールバックする作りなので、書き損ねると
        # 「ビルドは通るがPlayに弾かれる」になる。先にここで落とす。
        script: |
          set -euo pipefail
          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "keystore が渡っていない。Codemagic の code signing identity を確認すること。"
            exit 1
          fi
          cat > key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: AAB をビルド
        working_directory: apps/mobile
        script: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="${API_BASE_URL:?変数グループ mobile-dart-defines がこのビルドに渡っていない。Codemagic UI > このアプリ > Environment variables でグループ名と紐づけを確認すること}" \
            --dart-define=REVENUECAT_IOS_PUBLIC_SDK_KEY="${REVENUECAT_IOS_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ANDROID_PUBLIC_SDK_KEY="${REVENUECAT_ANDROID_PUBLIC_SDK_KEY:-}" \
            --dart-define=REVENUECAT_SDK_KEY="${REVENUECAT_SDK_KEY:-}" \
            --dart-define=REVENUECAT_ENTITLEMENT_ID="${REVENUECAT_ENTITLEMENT_ID:-premium}" \
            --dart-define=REVENUECAT_OFFERING_ID="${REVENUECAT_OFFERING_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-}" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-}" \
            --dart-define=TERMS_URL="${TERMS_URL:-}" \
            --dart-define=SUPPORT_EMAIL="${SUPPORT_EMAIL:-}"

    artifacts:
      - apps/mobile/build/app/outputs/bundle/release/*.aab
      - apps/mobile/build/app/outputs/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - k.fuke@emobi.co.jp
        notify:
          success: false
          failure: true
