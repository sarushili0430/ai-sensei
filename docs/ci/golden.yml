name: Update goldens

# Manual trigger only.
#
# Re-baking on every push makes golden tests lose their ability to detect breakage:
# they become a rubber stamp, and an unintended visual change is overwritten as "correct".
# Re-bake only when a human has confirmed the change was intended.
#
# The branch is chosen at launch (workflow_dispatch checks out the chosen ref).
on:
  workflow_dispatch:

jobs:
  goldens:
    name: Regenerate goldens (Linux)
    # The same runner as `ci.yml`'s flutter job. Goldens look at font rasterization, so
    # drift here bakes PNGs that differ from the moment they are created.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Even how the version is obtained matches `ci.yml`.
      # It reads the same file rather than repeating "3.44.8", so bumping `.fvmrc` cannot
      # leave one side stale.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/mobile/.fvmrc
          cache: true

      - run: flutter pub get
        working-directory: apps/mobile

      # Generated files (.freezed.dart / .g.dart) are not committed, so build them here
      - run: dart run build_runner build
        working-directory: apps/mobile

      # `--tags golden` runs only the golden tests (the tag is declared in `dart_test.yaml`).
      # Running everything would just turn the job red on unrelated failures while the PNGs
      # were re-baked anyway - a confusing state.
      - name: Regenerate goldens
        working-directory: apps/mobile
        run: flutter test --update-goldens --tags golden

      # `--update-goldens` succeeds even when there are differences.
      # "The job was green" does not mean "nothing changed", so what was rewritten is
      # printed to the log (so you know what to expect before downloading the artifact).
      - name: Show which goldens changed
        run: git status --porcelain apps/mobile/test/golden/goldens/

      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: apps/mobile/test/golden/goldens/
          # Zero files means nothing was baked. Do not silently upload an empty artifact.
          if-no-files-found: error
