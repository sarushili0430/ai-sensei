name: ai_sensei
description: 数学の「わかったつもり」を、声に出して説明させて見つけるアプリ。
publish_to: "none"
version: 0.1.0+1

environment:
  # Flutterのバージョンは .fvmrc で固定する(fvm use)。
  # ここは「このSDK以上なら動く」下限。
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状態管理 / DI (handoff §5)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # モデル定義(freezed + json_serializable)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 画面遷移
  go_router: ^14.6.2

  # 撮影
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # リアルタイム会話
  livekit_client: ^2.3.5
  permission_handler: ^11.3.1

  # 課金 / 通知 / 監視
  purchases_flutter: ^10.7.0
  # RevenueCatのペイウォールとCustomer Center。
  # コアと同じバージョンで揃える(片方だけ上げるとネイティブ側が食い違う)。
  purchases_ui_flutter: ^10.7.0
  onesignal_flutter: ^5.2.6
  sentry_flutter: ^8.12.0

  http: ^1.2.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # コード生成
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.0

  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.0

flutter:
  uses-material-design: true
  fonts:
    # 丸ゴシック(handoff §7)。SIL OFL 1.1。
    # golden test はこのフォントを読み込んで描画するので、
    # ファイルが欠けるとテストが落ちる(= 気づける)。
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Regular.ttf
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
