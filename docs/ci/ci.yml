name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Do not run CI for the side you did not touch (Flutter's pub get + build_runner is
  # especially heavy).
  #
  # The split is per job rather than a workflow-wide `on.paths` so that out-of-scope
  # jobs are always reported as "skipped". Filtering with `on.paths` never creates the
  # check at all, and with it as a required status check the PR waits forever.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # On a PR the diff comes from the API (on push, the checked-out git history is used)
    permissions:
      contents: read
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - "backend/**"
              - "packages/**"
              - "prompts/**"
              - "scripts/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - "biome.json"
              - "vitest.config.ts"
              - ".github/workflows/ci.yml"
            flutter:
              - "apps/mobile/**"
              # contract_fixture_test.dart reads packages/contract/fixtures directly
              - "packages/contract/**"
              - ".github/workflows/ci.yml"

  typescript:
    name: TypeScript (backend / packages)
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installed at the version in package.json's packageManager field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A failure does not stop what follows. When lint fails we still want the test results.
      - name: Lint (Biome)
        run: pnpm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

      # Tests can pass under Vitest/Node yet fail in the Workers bundler (esbuild).
      # A JSON import attribute really did break only the production build, so it is always bundled here.
      - name: Worker build (dry-run)
        if: ${{ !cancelled() }}
        run: pnpm --filter @ai-sensei/api build:check

  flutter:
    name: Flutter (apps/mobile)
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version is read from apps/mobile/.fvmrc (the same file fvm uses)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/mobile/.fvmrc
          cache: true

      - run: flutter pub get
        working-directory: apps/mobile

      # Generated files (.freezed.dart / .g.dart) are not committed, so build them here
      - run: dart run build_runner build
        working-directory: apps/mobile

      - run: flutter analyze
        working-directory: apps/mobile

      # contract_fixture_test.dart reads packages/contract/fixtures, so this confirms it
      # passes against the same contract as the TypeScript side.
      # This is also authoritative for the golden tests (Linux rasterization is the baseline).
      - run: flutter test
        working-directory: apps/mobile

      # Lets us look at the diff images when a golden fails
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: apps/mobile/test/golden/failures/
          if-no-files-found: ignore

  # A leaked key can come from any directory, so this one always runs.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo is public, so one committed key is fatal.
      # It should run without installing dependencies, so no pnpm install here.
      - name: Scan tracked files for secrets
        run: node --experimental-strip-types scripts/verify-no-secrets.ts
