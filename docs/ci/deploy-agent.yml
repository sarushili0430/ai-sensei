# Deploys backend/agent (LiveKit Agents).
#
#   develop branch -> develop environment
#   main    branch -> production environment
#
# The source is sent to LiveKit Cloud and the build runs there. Handing over a baked
# image (`lk agent deploy --image`) is Enterprise-only and unavailable.
# The steps and the list of secrets are in docs/deploy-agent.md.
name: Deploy (backend/agent)

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/agent/**"
      - "packages/**"
      - "prompts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-agent.yml"
  # For re-running by hand (a redeploy with no code change, after swapping a secret, ...)
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先"
        type: choice
        options: [develop, production]
        default: develop

# Deploys of the same branch are serialized. A running deploy is never cancelled
# (so a worker mid-conversation is not discarded halfway through draining).
concurrency:
  group: deploy-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}

    env:
      TARGET: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Overlaps with the CI workflow, but a deploy must stand on its own.
      # It prevents "CI was green, then a later push shipped something broken".
      - name: Verify (lint / typecheck / secret scan / test)
        run: pnpm run verify

      # The LiveKit-side build takes minutes, and a failure means reading their logs.
      # Baking it here first surfaces a merely broken Dockerfile at this point.
      # The image is unused (there is nowhere to push it), so only the cache matters.
      - uses: docker/setup-buildx-action@v3
      - name: Build image (fail fast)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash

      # `lk` is still a fast-moving CLI. When a flag name stops matching, check
      # `lk agent deploy --help` and fix it (the same note is in docs/deploy-agent.md).
      #
      # The working directory (= the repo root) becomes the build context and the
      # Dockerfile directly inside it is read. What is excluded is decided by .dockerignore.
      - name: Deploy to LiveKit Cloud
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          AGENT_ID: ${{ vars.LIVEKIT_AGENT_ID }}
        shell: bash
        run: |
          if [ -z "$AGENT_ID" ]; then
            echo "::error::LIVEKIT_AGENT_ID (Variables) が未設定です。初回は手元で lk agent create を流してください(docs/deploy-agent.md §2-2)"
            exit 1
          fi
          lk agent deploy --id "$AGENT_ID"

      # Wait a moment for the worker to re-register with LiveKit. Failing to read the
      # status does not fail the job - the deploy itself succeeded.
      - name: Status
        continue-on-error: true
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          AGENT_ID: ${{ vars.LIVEKIT_AGENT_ID }}
        run: |
          sleep 30
          lk agent status --id "$AGENT_ID"
