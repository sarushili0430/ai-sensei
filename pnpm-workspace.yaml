packages:
  - "packages/*"
  - "backend/*"
  - "apps/lp" # The landing page. Served by wrangler, so deploy runs from here.

# apps/* is not added wholesale because apps/mobile is Flutter.
# Only apps/lp belongs in the JS workspace, so it is listed by name.

# Dependencies allowed to run build scripts (pnpm 10 blocks them by default).
# When adding one, say in a line why it is needed.
onlyBuiltDependencies:
  - "@biomejs/biome" # fetches the native lint/format binary
  - lefthook # installs the native git-hooks binary
  - esbuild # the bundler wrangler ships with
  - workerd # the wrangler dev runtime
  - "@livekit/local-inference" # native inference for turn detection
  - onnxruntime-node # the ONNX runtime for Silero VAD
  - sharp # used by LiveKit Agents for image processing
