# git hooks are managed with lefthook (installed automatically by `pnpm install`'s prepare).
#
# What is checked differs completely between backend (TypeScript / Biome) and
# apps/mobile (Dart / flutter analyze), so each config lives under its own directory
# and this file only loads them. Both run only when that directory has changes
# (the `root:` setting in each file).
#
# Commits check lint only. typecheck, tests and builds are left to CI: waiting tens
# of seconds on every commit pushes people towards disabling the hook.
extends:
  - backend/lefthook.yml
  - apps/mobile/lefthook.yml

pre-commit:
  # backend and mobile are independent, so they run together
  parallel: true
  # Do not run during a merge or rebase (it would stop on changes you did not write)
  skip:
    - merge
    - rebase
