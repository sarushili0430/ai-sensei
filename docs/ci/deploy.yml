# Deploys backend/api (Cloudflare Workers).
#
#   develop branch -> develop environment (ai-sensei-api-develop)
#   main    branch -> production environment (ai-sensei-api-production)
#
# The environments are defined in backend/api/wrangler.toml; first-time setup is in
# docs/deploy.md. apps/mobile is distributed by Codemagic (codemagic.yaml) and is not
# handled here.
name: Deploy (backend/api)

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/api/**"
      - "packages/**"
      - "prompts/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy.yml"
  # For re-running by hand (a redeploy with no code change, after swapping a secret, ...)
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先"
        type: choice
        options: [develop, production]
        default: develop

# Deploys of the same branch are serialized. A running deploy is never cancelled
# (having only the migration applied while the deploy vanished is the worst state).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
    runs-on: ubuntu-latest

    # GitHub Environments. To require approval for production, add required reviewers
    # under Settings > Environments > production.
    environment:
      name: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
      url: ${{ steps.deploy.outputs.url }}

    env:
      TARGET: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deploying with placeholders still in place returns an opaque "no such resource"
      # from Cloudflare. Fail earlier.
      #
      # Only the target environment's sections are checked. Bringing up develop first and
      # creating production later is a normal order, so production being unconfigured must
      # not block a develop deploy (which is why the whole file is not grepped).
      - name: Check bindings are filled in
        run: pnpm run verify:bindings "$TARGET"

      # Overlaps with the CI workflow, but a deploy must stand on its own.
      # It prevents "CI was green, then a later push shipped something broken".
      - name: Verify (lint / typecheck / secret scan / test)
        run: pnpm run verify

      # Apply the schema before the code. Applied migrations are tracked in the
      # d1_migrations table, so re-running never applies them twice.
      - name: Apply D1 migrations
        run: pnpm --filter @ai-sensei/api run "migrate:$TARGET"

      - name: Deploy
        id: deploy
        shell: bash
        run: |
          # wrangler uses stdout and stderr line by line, so capture both
          pnpm --filter @ai-sensei/api run "deploy:$TARGET" 2>&1 | tee deploy.log
          # On workers.dev or a custom domain alike, wrangler prints the URL under triggers.
          # Links to docs or the dashboard are not picked up.
          # Finding none does not fail here (the deploy itself succeeded).
          # pipefail is on, so an empty grep is absorbed with `|| true`.
          url="$(grep -oE 'https://[A-Za-z0-9._-]+(/\*)?' deploy.log \
            | grep -vE 'cloudflare\.com|github\.com' \
            | tail -1 | sed 's#/\*$##' || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # develop and production look identical, so check the environment name /health reports.
      - name: Smoke check
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          if [ -z "$url" ]; then
            echo "::warning::デプロイ出力からURLを取れなかったので /health の確認を飛ばします"
            exit 0
          fi
          # Propagation takes a moment right after a deploy, so retry a few times
          body="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$url/health")"
          echo "$body"
          if ! grep -q "\"environment\":\"$TARGET\"" <<<"$body"; then
            echo "::error::$url/health が名乗る環境が $TARGET ではありません"
            exit 1
          fi
          echo "✔ $TARGET → $url"
